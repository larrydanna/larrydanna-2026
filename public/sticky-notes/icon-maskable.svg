<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Solid background (maskable icons need full bleed, safe zone is inner 80%) -->
  <rect width="512" height="512" fill="#221A10"/>
  <!-- Content fits within the ~410x410 safe zone centered at 256,256 -->
  <!-- Blue note (back) -->
  <rect x="216" y="216" width="196" height="168" rx="6" fill="#C0E8FF"/>
  <rect x="216" y="216" width="196" height="32" rx="6" fill="#90CFFA"/>
  <rect x="216" y="232" width="196" height="16" fill="#90CFFA"/>
  <line x1="238" y1="268" x2="392" y2="268" stroke="#7ABCE8" stroke-width="7" stroke-linecap="round"/>
  <line x1="238" y1="292" x2="392" y2="292" stroke="#7ABCE8" stroke-width="7" stroke-linecap="round"/>
  <line x1="238" y1="316" x2="360" y2="316" stroke="#7ABCE8" stroke-width="7" stroke-linecap="round"/>
  <!-- Yellow note (front) -->
  <rect x="100" y="100" width="210" height="188" rx="6" fill="#FFF8A8"/>
  <rect x="100" y="100" width="210" height="32" rx="6" fill="#F5E878"/>
  <rect x="100" y="116" width="210" height="16" fill="#F5E878"/>
  <line x1="122" y1="152" x2="288" y2="152" stroke="#C8BC60" stroke-width="7" stroke-linecap="round"/>
  <line x1="122" y1="176" x2="288" y2="176" stroke="#C8BC60" stroke-width="7" stroke-linecap="round"/>
  <line x1="122" y1="200" x2="252" y2="200" stroke="#C8BC60" stroke-width="7" stroke-linecap="round"/>
  <line x1="122" y1="224" x2="288" y2="224" stroke="#C8BC60" stroke-width="7" stroke-linecap="round"/>
  <line x1="122" y1="248" x2="220" y2="248" stroke="#C8BC60" stroke-width="7" stroke-linecap="round"/>
  <polygon points="310,288 310,268 290,288" fill="#D4C858" opacity="0.6"/>
</svg>
